# Serves the built SPA and reverse-proxies the API so the browser sees a single
# origin, which keeps the server's CORS allowlist out of the picture entirely —
# nothing here is a cross-origin call. That only holds if the API can tell it is
# same-origin, hence the forwarded-header plumbing below.

# The Cloudflare tunnel terminates TLS and forwards plain HTTP into this
# container, so `$scheme` here is always "http" — passing it on as
# X-Forwarded-Proto would erase the scheme the browser actually used and leave
# the API unable to tell same-origin calls apart from cross-origin ones. Honour
# an upstream value when there is one; only two values are ever accepted.
map $http_x_forwarded_proto $client_proto {
    default  $scheme;
    https    https;
    http     http;
}

upstream thykra_api {
    # `server` is the Compose service name on the shared bridge network.
    server server:8081;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Media uploads are large; don't let nginx cap them.
    client_max_body_size 512M;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed Vite assets are immutable.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://thykra_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $client_proto;
        # `$http_host` is the exact host:port the browser asked for, port
        # included — unlike `$host`, which drops it and would make
        # http://tower.local:8088 look like port 80 to the API.
        proxy_set_header X-Forwarded-Host  $http_host;

        # Uploads and image processing can outlast the 60s default.
        proxy_connect_timeout 30s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
        proxy_request_buffering off;
    }

    # TanStack Router owns client-side routing — every unknown path is the SPA.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html must never be cached, or clients pin to a stale asset manifest.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}

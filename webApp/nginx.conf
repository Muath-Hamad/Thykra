# Serves the built SPA and reverse-proxies the API so the browser sees a single
# origin. That is what keeps the server's CORS config (which only allows
# localhost:8080) irrelevant in this deployment — no cross-origin API calls.

upstream thykra_api {
    # `server` is the Compose service name on the shared bridge network.
    server server:8081;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Media uploads are large; don't let nginx cap them.
    client_max_body_size 512M;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed Vite assets are immutable.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://thykra_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Uploads and image processing can outlast the 60s default.
        proxy_connect_timeout 30s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
        proxy_request_buffering off;
    }

    # TanStack Router owns client-side routing — every unknown path is the SPA.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html must never be cached, or clients pin to a stale asset manifest.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}

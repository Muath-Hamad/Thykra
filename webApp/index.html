<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thykra</title>
    <meta name="description" content="One shared trip album. Everyone drops their photos in. Nobody chases anybody for the good ones.">

    <!-- App-level OG/Twitter floor — per-trip tags are a hosting task (edge inject on /invite/*, /public/*, /s/*). -->
    <meta property="og:site_name" content="Thykra">
    <meta property="og:title" content="Thykra — Travel Together. Remember Forever.">
    <meta property="og:description" content="One shared trip album. Everyone drops their photos in.">
    <meta property="og:type" content="website">
    <meta property="og:image" content="/og.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Thykra — Travel Together. Remember Forever.">
    <meta name="twitter:description" content="One shared trip album. Everyone drops their photos in.">

    <link rel="icon" type="image/svg+xml" href="/favicon.svg">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,400..900;1,400..900&family=Readex+Pro:wght@200..700&display=swap" rel="stylesheet">

    <script>
      // Resolve theme before first paint so there is no flash of the wrong mode.
      (function () {
        try {
          var stored = localStorage.getItem('thykra.theme');
          var dark = stored === 'dark' ||
            (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.setAttribute('data-theme', 'dark');
          var lang = localStorage.getItem('thykra.lang');
          if (lang === 'ar') {
            document.documentElement.setAttribute('lang', 'ar');
            document.documentElement.setAttribute('dir', 'rtl');
          }
        } catch (e) { /* private mode — defaults hold */ }
      })();
    </script>
    <style>
      /* Boot backdrop only — real styles arrive with the bundle. */
      html { background: #FBF6ED; }
      html[data-theme="dark"] { background: #121114; }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
</body>
</html>

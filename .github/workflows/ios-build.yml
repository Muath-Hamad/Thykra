name: iOS smoke build

# macOS runners are billed at a higher rate than Linux runners, so this only
# runs on push to main. PR validation of iOS Kotlin code happens in ci.yml on
# Linux via :composeApp:compileKotlinIos*.
on:
  push:
    branches: [main]

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-framework:
    name: Link iOS framework (macOS)
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # The macos-14 image ships with Xcode preinstalled; this just pins the
      # version actively selected so the Kotlin/Native toolchain finds clang/ld.
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            .gradle
          key: gradle-ios-mac-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: |
            gradle-ios-mac-${{ runner.os }}-
            gradle-${{ runner.os }}-

      # composeApp uses the standard kotlin { iosX().binaries.framework {} } block
      # (no kotlin-cocoapods plugin), so the right link task is
      # linkDebugFrameworkIosSimulatorArm64. This both compiles AND links, so it
      # exercises the parts compileKotlinIos* on Linux can't.
      - name: Link iOS simulator framework
        run: ./gradlew :composeApp:linkDebugFrameworkIosSimulatorArm64 --no-daemon --stacktrace

      - name: Upload composeApp reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-framework-reports
          path: composeApp/build/reports
          if-no-files-found: ignore

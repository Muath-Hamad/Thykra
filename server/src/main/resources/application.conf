ktor {
    deployment {
        port = 8081
    }
    application {
        modules = [com.jameeli.thykra.ApplicationKt.module]
    }
}

database {
    url = "jdbc:h2:file:./data/thykra;MODE=PostgreSQL;AUTO_SERVER=TRUE"
    url = ${?DATABASE_URL}
    driver = "org.h2.Driver"
    driver = ${?DATABASE_DRIVER}
    user = "sa"
    user = ${?DATABASE_USER}
    password = ""
    password = ${?DATABASE_PASSWORD}
    maxPoolSize = 10
}

jwt {
    issuer = "thykra-api"
    audience = "thykra-users"
    realm = "thykra"
    secret = "dev-secret-change-in-production"
    secret = ${?JWT_SECRET}
    accessTokenExpiry = 3600
    refreshTokenExpiry = 2592000
}

storage {
    type = "local"
    type = ${?STORAGE_TYPE}
    localPath = "./data/media"
    localPath = ${?STORAGE_LOCAL_PATH}
    baseUrl = "http://localhost:8081"
    baseUrl = ${?STORAGE_BASE_URL}
    s3 {
        bucket = ""
        bucket = ${?S3_BUCKET}
        region = "us-east-1"
        region = ${?S3_REGION}
        # Optional custom endpoint (e.g. http://localstack:4566). Empty => real AWS.
        endpoint = ""
        endpoint = ${?S3_ENDPOINT}
        # Optional static credentials. Empty => fall back to AWS default credential chain
        # (env, profile, instance role). LocalStack uses "test"/"test".
        accessKey = ""
        accessKey = ${?S3_ACCESS_KEY}
        secretKey = ""
        secretKey = ${?S3_SECRET_KEY}
        # Public base URL used when constructing object URLs. Empty => derive from endpoint
        # or virtual-hosted-style AWS URL.
        publicBaseUrl = ""
        publicBaseUrl = ${?S3_PUBLIC_BASE_URL}
        # Path-style access required for LocalStack and most S3-compatible providers.
        pathStyleAccess = false
        pathStyleAccess = ${?S3_PATH_STYLE_ACCESS}
        # Presigned URL TTL in seconds.
        presignExpirySeconds = 3600
        presignExpirySeconds = ${?S3_PRESIGN_EXPIRY_SECONDS}
    }
}

oauth {
    google {
        clientId = ""
        clientId = ${?GOOGLE_CLIENT_ID}
    }
    apple {
        clientId = ""
        clientId = ${?APPLE_CLIENT_ID}
        teamId = ""
        teamId = ${?APPLE_TEAM_ID}
        keyId = ""
        keyId = ${?APPLE_KEY_ID}
    }
}

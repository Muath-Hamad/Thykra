#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M

#Gradle
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true

# AGP 9 stopped supporting com.android.application/library alongside the Kotlin
# Multiplatform plugin. The recommended replacement,
# com.android.kotlin.multiplatform.library, covers a KMP *library* but there is no
# application equivalent, and :composeApp has to stay an application with an iOS
# target. These two properties are the bypass AGP itself points at, and they keep
# the previous Kotlin/DSL wiring in place.
#
# Revisit when AGP ships a KMP-aware application plugin.
android.builtInKotlin=false
android.newDsl=false